<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Developers - Example Payments</title>
  <script src="/fakes.js"></script>
</head>
<body>
  <h1>Developers</h1>
  <h2>Standard keys</h2>
  <label for="live-key">Live secret key</label>
  <input id="live-key" type="text" readonly>
  <span id="shown">sk_live_••••••••••••1234</span>
  <button id="reveal" type="button">Reveal live key</button>
  <h2>Webhooks</h2>
  <p>Signing secret: <span id="whsec"></span></p>
  <p>Card on file: <span id="card"></span>. Invoice 4111 1111 1111 1112 (not a card). Order 1234567890123456.</p>
  <script>
    const F = FAKE_SECRETS;
    document.getElementById('live-key').value = F.stripe;
    document.getElementById('whsec').textContent = F.stripeWebhook;
    document.getElementById('card').textContent = F.card;
    document.getElementById('reveal').addEventListener('click', () => {
      document.getElementById('shown').textContent = F.stripe;
    });
  </script>
</body>
</html>
