<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project settings</title>
</head>
<body>
  <!-- Secret handles (test/secret-handles*.test.js): the page a secret read on another site is pasted into. Fields that
       take a secret (an API key text field, a password field) and fields that never do (a search box, a textarea, a
       comment field, an email field, a contenteditable note). The preview echoes the API key field, as some settings
       pages do, so the echo must be redacted too. -->
  <h1>Project settings</h1>
  <form role="search" onsubmit="return false">
    <input type="search" name="q" aria-label="Search projects">
    <button type="submit">Search</button>
  </form>
  <form id="contact" onsubmit="return false">
    <p><label>Contact email <input id="email" name="email" type="email"></label></p>
  </form>
  <form id="env" onsubmit="return false">
    <p><label>API key <input id="api" name="apiKey" type="text" autocomplete="off"></label></p>
    <p><label>Database password <input id="dbpass" name="dbpass" type="password"></label></p>
    <p><label>Notes <textarea id="notes" name="notes" rows="2" cols="40"></textarea></label></p>
    <p><label>Comment <input id="comment" name="comment" type="text"></label></p>
    <p><label>Key description <input id="keydesc" name="keyDescription" type="text"></label></p>
    <div id="memo" contenteditable="true" role="textbox" aria-label="Secret memo">Write here</div>
    <p>Preview: <span id="preview"></span></p>
    <button type="button" id="save">Save</button>
  </form>
  <script>
    const api = document.getElementById('api');
    api.addEventListener('input', () => { document.getElementById('preview').textContent = api.value; });
  </script>
</body>
</html>
