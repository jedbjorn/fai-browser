<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downloads</title>
  <script src="/fakes.js"></script>
</head>
<body>
  <h1>Downloads</h1>
  <p>Your access key file (credentials.csv):</p>
  <pre id="csv"></pre>
  <p>Deploy key for the build server:</p>
  <textarea id="pem" rows="6" cols="70"></textarea>
  <p>The same key, one line per element:</p>
  <div id="lines" class="mono"></div>
  <p>Other services: <span id="hf"></span>, <span id="gl"></span>, maps <span id="google"></span>.</p>
  <p>Slack incoming webhook: <span id="hook"></span></p>
  <p>Staging database: <span id="db"></span></p>
  <script>
    const F = FAKE_SECRETS;
    document.getElementById('csv').textContent = `Access key ID,Secret access key\n${F.awsId},${F.awsSecret}\n`;
    document.getElementById('pem').textContent = F.pem;
    const lines = document.getElementById('lines');
    for (const line of F.pem.split('\n')) {
      const div = document.createElement('div');
      div.textContent = line;
      lines.append(div);
    }
    document.getElementById('hf').textContent = F.huggingface;
    document.getElementById('gl').textContent = F.gitlab;
    document.getElementById('google').textContent = F.google;
    document.getElementById('hook').textContent = F.slackWebhook;
    document.getElementById('db').textContent = F.dbUrl;
  </script>
</body>
</html>
