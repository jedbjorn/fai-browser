<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Personal access tokens</title>
  <script src="/fakes.js"></script>
</head>
<body>
  <h2>Personal access tokens (classic)</h2>
  <div class="flash">Make sure to copy your personal access token now. You won't be able to see it again!</div>
  <div class="token-row">
    <code id="token"></code>
    <clipboard-copy id="clip" role="button" tabindex="0" aria-label="Copy token">Copy</clipboard-copy>
  </div>
  <h3>Fine-grained tokens</h3>
  <ul>
    <li>deploy-bot: <code id="pat"></code></li>
    <li>npm publish: <code id="npm"></code></li>
    <li>Build id <kbd>BUILD7f3a9c2e1d0b8a6f</kbd></li>
  </ul>
  <p><a href="/settings/tokens/">Back to tokens</a></p>
  <script>
    const F = FAKE_SECRETS;
    document.getElementById('token').textContent = F.github;
    document.getElementById('clip').setAttribute('value', F.github);
    document.getElementById('pat').textContent = F.githubPat;
    document.getElementById('npm').textContent = F.npm;
  </script>
</body>
</html>
