<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project settings</title>
  <script src="/fakes.js"></script>
</head>
<body>
  <h1>Project settings</h1>
  <h2>Environment Variables</h2>
  <table>
    <thead><tr><th>Key</th><th>Value</th><th>Environments</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p>Last deployment: commit 9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b.</p>
  <script>
    const F = FAKE_SECRETS;
    const rows = [
      ['OPENAI_API_KEY', F.anthropic, 'Production, Preview'],
      ['DATABASE_URL', F.dbUrl, 'Production'],
      ['SESSION_SECRET', F.sessionSecret, 'Production, Preview, Development'],
      ['SLACK_BOT_TOKEN', F.slack, 'Production'],
      ['NEXT_PUBLIC_SITE_NAME', 'Acme Store', 'Production'],
    ];
    for (const [name, value, envs] of rows) {
      const tr = document.createElement('tr');
      for (const text of [name, value, envs]) {
        const td = document.createElement('td');
        td.textContent = text;
        tr.append(td);
      }
      document.getElementById('rows').append(tr);
    }
  </script>
</body>
</html>
