<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Integrations</title>
  <script src="/fakes.js"></script>
</head>
<body>
  <h1>Integrations</h1>
  <p>Connected apps and their settings.</p>
  <iframe id="frame" src="/embedded-frame.html" width="600" height="120"></iframe>
  <div id="host"></div>
  <p id="late">Generating your token…</p>
  <a href="/">Home</a>
  <script>
    const F = FAKE_SECRETS;
    const root = document.getElementById('host').attachShadow({ mode: 'open' });
    root.innerHTML = '<p>Shadow widget token: <code></code></p><button type="button">Rotate</button>';
    root.querySelector('code').textContent = F.githubShadow;
    // A key that appears 50 ms after load.
    addEventListener('load', () => setTimeout(() => {
      document.getElementById('late').textContent = `Your new key: ${F.xai}`;
    }, 50));
  </script>
</body>
</html>
