<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account</title>
  <script src="/fakes.js"></script>
</head>
<body>
  <h1>Account</h1>
  <section>
    <h2>Set up your authenticator</h2>
    <p>Scan the QR code, or enter this setup key into your app: <strong id="totp"></strong></p>
  </section>
  <section>
    <h2>Recovery codes</h2>
    <p>Keep these somewhere safe. Each code works once.</p>
    <ul id="codes"></ul>
    <button type="button">Download</button>
  </section>
  <section>
    <h2>Sign-in</h2>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">
    <button id="toggle" type="button">Show password</button>
    <p>Temporary password: <span id="temp"></span></p>
  </section>
  <section>
    <h2>Orders</h2>
    <p>Order 112-1234567-1234567, tracking 1Z999AA10123456784, total $41.99.</p>
  </section>
  <script>
    const F = FAKE_SECRETS;
    document.getElementById('totp').textContent = F.totp;
    for (const code of F.recovery) {
      const li = document.createElement('li');
      li.textContent = code;
      document.getElementById('codes').append(li);
    }
    document.getElementById('pw').value = F.password;
    document.getElementById('temp').textContent = F.password;
    document.getElementById('toggle').addEventListener('click', () => {
      const pw = document.getElementById('pw');
      pw.type = pw.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
