<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>Wide right-to-left page</title></head>
<body style="margin: 0">
<!-- Wider than the viewport, right to left: content on the left is reached by scrolling left. -->
<div style="width: 3000px; height: 200px; position: relative">
  <label style="position: absolute; left: 100px; top: 20px">Far field <input name="far"></label>
  <label style="position: absolute; right: 20px; top: 20px">Near field <input name="near"></label>
</div>
</body>
</html>
