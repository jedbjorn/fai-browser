<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Carousel</title></head>
<body style="margin: 0">
<!-- A horizontal carousel (an inner scroller) shown at its second slide; the first slide holds a field. -->
<div id="track" style="width: 600px; overflow-x: auto; white-space: nowrap">
  <div style="display: inline-block; width: 600px"><label>Slide one <input name="one"></label></div><div style="display: inline-block; width: 600px"><label>Slide two <input name="two"></label></div>
</div>
<script>document.getElementById('track').scrollLeft = 600;</script>
</body>
</html>
