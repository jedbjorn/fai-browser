<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Embedded timetable</title>
<style>body{font:16px sans-serif;margin:0}main{padding:16px}iframe{width:600px;height:240px;border:1px solid #999}</style></head>
<body>
<main><h1>Ferry timetable</h1><p>The timetable below is embedded from our schedule service.</p>
<!-- Pattern: a same-origin iframe with text, a table and a link; and a srcdoc frame. Both are read like the page. -->
<iframe src="iframe-child.html" title="Timetable"></iframe>
<iframe srcdoc="<p>Notice: the 07:10 ferry does not run on Sundays.</p>" title="Notice"></iframe>
</main>
</body></html>
