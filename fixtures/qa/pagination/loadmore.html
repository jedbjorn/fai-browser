<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe archive · Greenhouse Co-op</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;color:#1d2330;background:#fff;line-height:1.5}
header.site{display:flex;gap:18px;align-items:center;padding:12px 24px;background:#f2f4f8;border-bottom:1px solid #d9dee8}
header.site strong{margin-right:auto}main{max-width:880px;margin:0 auto;padding:24px}a{color:#1f5fbf}
button{font:inherit;padding:6px 12px;border:1px solid #8a94a8;border-radius:6px;background:#fff;cursor:pointer}
table{border-collapse:collapse}td,th{border:1px solid #d9dee8;padding:6px 10px;text-align:left}footer{padding:24px;color:#5a6478;border-top:1px solid #e3e6ee;margin-top:40px}</style>
</head>
<body>
<header class="site"><strong>Greenhouse Co-op</strong></header><main><h1>Recipe archive</h1><p id="count"></p><ol id="list"></ol>
<p><button type="button" id="more">Load more</button></p></main>
<script>
var R=["Barley and leek soup","Beetroot hummus","Bramble crumble","Carrot and cumin fritters","Chickpea stew","Crab apple jelly","Fennel gratin","Gooseberry fool","Kale pesto","Mussels with cider","Nettle soup","Oat soda bread","Parsnip cake","Pickled samphire","Plum chutney","Quince paste","Rhubarb cordial","Smoked mackerel pate"];var shown=0;
function render(n){var ol=document.getElementById('list');R.slice(shown,shown+n).forEach(function(r){var li=document.createElement('li');li.textContent=r;ol.appendChild(li);});shown=Math.min(R.length,shown+n);
document.getElementById('count').textContent='Showing '+shown+' of '+R.length+' recipes';if(shown>=R.length)document.getElementById('more').remove();}
render(6);document.getElementById('more').onclick=function(){var b=this;b.disabled=true;b.textContent='Loading…';setTimeout(function(){render(6);if(document.body.contains(b)){b.disabled=false;b.textContent='Load more';}},300);};
</script>
</body>
</html>
