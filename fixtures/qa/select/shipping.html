<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipping rates · Northwind</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;color:#1d2330;background:#fff;line-height:1.5}
header.site{display:flex;gap:18px;align-items:center;padding:12px 24px;background:#f2f4f8;border-bottom:1px solid #d9dee8}
header.site strong{margin-right:auto}main{max-width:880px;margin:0 auto;padding:24px}a{color:#1f5fbf}
button{font:inherit;padding:6px 12px;border:1px solid #8a94a8;border-radius:6px;background:#fff;cursor:pointer}
table{border-collapse:collapse}td,th{border:1px solid #d9dee8;padding:6px 10px;text-align:left}footer{padding:24px;color:#5a6478;border-top:1px solid #e3e6ee;margin-top:40px}</style>
</head>
<body>
<header class="site"><strong>Northwind</strong></header><main><h1>Shipping rates</h1>
<p><label for="region">Region</label>
<select id="region"><option value="">Choose a region</option><option value="eu">Europe</option><option value="na">North America</option><option value="oc">Oceania</option><option value="as">Asia</option></select></p>
<p id="rate" aria-live="polite">Select a region to see the shipping cost.</p></main>
<script>
var RATES={eu:'Shipping to Europe: $6.90 (2 to 4 days)',na:'Shipping to North America: $12.40 (4 to 6 days)',oc:'Shipping to Oceania: $18.50 (7 to 10 days)',as:'Shipping to Asia: $14.75 (5 to 8 days)'};
document.getElementById('region').onchange=function(e){document.getElementById('rate').textContent=RATES[e.target.value]||'Select a region to see the shipping cost.';};
</script>
</body>
</html>
