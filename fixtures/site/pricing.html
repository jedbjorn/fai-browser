<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Pricing</title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav aria-label="Main"><a href="/index.html">Home</a><a href="/about.html">About</a><a href="/pricing.html">Pricing</a><a href="/docs/index.html">Docs</a><a href="/catalog/page-1.html">Catalog</a><a href="/contact.html">Contact</a><a href="/slow.html">Reconciliation status</a></nav>
<main><h1>Pricing</h1>
<table><thead><tr><th>Plan</th><th>Monthly</th><th>Yearly</th><th>Seats</th></tr></thead><tbody>
<tr><td>Starter</td><td>$12 per month</td><td>$120 per year</td><td>2</td></tr>
<tr><td>Pro</td><td>$37 per month</td><td>$370 per year</td><td>10</td></tr>
<tr><td>Team</td><td>$96 per month</td><td>$960 per year</td><td>40</td></tr>
</tbody></table>
<h2>Plan details</h2>
<label>Plan <select id="plan" aria-label="Plan"><option value="starter">Starter</option><option value="pro">Pro</option><option value="team">Team</option></select></label>
<button type="button" id="show">Show plan details</button>
<output id="details" aria-live="polite"></output>
<script>
const details={starter:"Starter includes 5 GB storage and email support.",pro:"Pro includes 250 GB storage and priority support.",team:"Team includes 2 TB storage and a named account manager."};
document.querySelector("#show").onclick=()=>{document.querySelector("#details").textContent=details[document.querySelector("#plan").value];};
</script></main>
<footer>Lanternfish Cloud is a fictional product used for benchmark fixtures.</footer>
</body></html>
