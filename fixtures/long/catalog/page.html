<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outdoor gear catalog · Fellside Supply</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;color:#1d2330;background:#fff;line-height:1.45}
header.site{display:flex;gap:16px;align-items:center;padding:10px 24px;background:#f2f4f8;border-bottom:1px solid #d9dee8}header.site strong{margin-right:auto}
main{max-width:880px;margin:0 auto;padding:16px 24px}a{color:#1f5fbf}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d9dee8;padding:5px 10px;text-align:left}
nav.pager{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}nav.pager [aria-current]{font-weight:700}.out{color:#9a3b3b}footer{padding:16px 24px;color:#5a6478;border-top:1px solid #e3e6ee;margin-top:32px}</style>
</head>
<body>
<header class="site"><strong>Fellside Supply</strong><a href="/long/catalog/page.html?p=1">Catalog</a><a href="/long/catalog/stores.html">Stores</a><a href="/long/catalog/help.html">Help</a></header>
<main>
  <h1>Outdoor gear catalog</h1>
  <p id="where"></p>
  <table aria-label="Products"><thead><tr><th>Product</th><th>Category</th><th>SKU</th><th>Price</th><th>Availability</th></tr></thead><tbody id="rows"></tbody></table>
  <nav class="pager" aria-label="Catalog pages" id="pager"></nav>
</main>
<footer>Prices include VAT. Stock is updated nightly.</footer>
<script>
(function(){
  // 13 pages of 8 products. The tents are fixed per page; the other rows are filled from fixed lists by position.
  var TENTS={
    1:[['Ridgeback 3P tent','TN-1301',249,1]],2:[['Fernhill 1P tent','TN-1102',159,1]],3:[['Corrie 2P tent','TN-1203',189,1]],
    4:[['Saltmarsh 2P tent','TN-1204',119,0]],5:[['Bothy 4P tent','TN-1405',319,1]],6:[['Tor 1P tent','TN-1106',145,1]],7:[],
    8:[['Scree 2P tent','TN-1208',172,1]],9:[['Gully 3P tent','TN-1309',229,1]],10:[['Cairn 2P tent','TN-1210',141,1]],
    11:[['Larkspur 2P tent','TN-1129',129,1]],12:[['Moraine 1P tent','TN-1112',133,1]],
    13:[['Kestrel 3P tent','TN-1313',115,0],['Larkspur 2P tent (ex-display)','TN-1129X',99,0]]
  };
  var EXTRA={9:[['Tent footprint 2P','AC-0909','Accessories',29,1]],4:[['Tent repair kit','AC-0404','Accessories',12,1]]};
  var OTHER=[['Packs','Cragline 38 L pack'],['Stoves','Ember mini stove'],['Sleeping bags','Lowfold -5 sleeping bag'],['Lanterns','Glim 300 lantern'],
    ['Packs','Tarn 22 L daypack'],['Stoves','Bracken twin burner'],['Sleeping bags','Haar summer quilt'],['Lanterns','Skerry head torch'],
    ['Cookware','Brew 1 L kettle'],['Cookware','Gill titanium pot']];
  var p=Math.max(1,Math.min(13,parseInt(new URLSearchParams(location.search).get('p')||'1',10)||1));
  var rows=[];
  (TENTS[p]||[]).forEach(function(t){rows.push([t[0],'Tents',t[1],t[2],t[3]]);});
  (EXTRA[p]||[]).forEach(function(e){rows.push([e[0],e[2],e[1],e[3],e[4]]);});
  for(var i=0;rows.length<8;i++){var o=OTHER[(p*3+i)%OTHER.length];var price=18+((p*37+i*53)%160);
    rows.push([o[1]+' · batch '+(p*10+i),o[0],'OT-'+(p*100+i),price,(p+i)%4!==0?1:0]);}
  // A fixed order that is not by category: rotate by page.
  rows=rows.slice(p%8).concat(rows.slice(0,p%8));
  document.getElementById('where').textContent='Page '+p+' of 13 · 8 products';
  document.title='Catalog page '+p+' of 13 · Fellside Supply';
  var tb=document.getElementById('rows');
  rows.forEach(function(r){var tr=document.createElement('tr');
    tr.innerHTML='<td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>€'+r[3]+'</td><td class="'+(r[4]?'':'out')+'">'+(r[4]?'In stock':'Out of stock')+'</td>';tb.appendChild(tr);});
  var nav=document.getElementById('pager');
  function link(text,n,label){var a=document.createElement('a');a.href='/long/catalog/page.html?p='+n;a.textContent=text;if(label)a.setAttribute('aria-label',label);
    if(n===p&&!label)a.setAttribute('aria-current','page');nav.appendChild(a);}
  if(p>1)link('‹ Previous page',p-1,'Previous page');
  for(var n=1;n<=13;n++)link(String(n),n);
  if(p<13)link('Next page ›',p+1,'Next page');
})();
</script>
</body>
</html>
