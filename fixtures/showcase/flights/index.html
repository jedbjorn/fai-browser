<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Skyline Flights</title><link rel="stylesheet" href="../style.css"><script src="app.js" defer></script></head><body><header><h1>Skyline Flights</h1></header><main><h2>Search one-way flights</h2><div class="row"><label>From<input id="from" value="Marseille (MRS)" readonly></label><label>To<input id="to" role="combobox" aria-autocomplete="list" aria-controls="places" autocomplete="off" placeholder="City or airport"><div id="places" role="listbox" hidden></div></label><label>Departure<button id="date-open" type="button">Choose date</button></label></div><div id="calendar" role="dialog" aria-label="Departure calendar" hidden><h3>November 2026</h3><div id="days"></div><button id="date-done" type="button">Done</button></div><button id="search" type="button">Search flights</button><p id="form-error" class="error" role="alert"></p><section id="results" hidden><h2>Flights for <span id="selected-date"></span></h2><div class="row"><label><input id="nonstop" type="checkbox">Nonstop only</label><label>Sort by<select id="sort"><option value="recommended">Recommended</option><option value="price">Price (lowest first)</option><option value="departure">Departure time</option></select></label></div><div id="flight-list" aria-live="polite"></div></section></main></body></html>
