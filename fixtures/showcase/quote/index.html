<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Harbor Insurance Quote</title><link rel="stylesheet" href="../style.css"><script src="app.js" defer></script></head><body><header><h1>Harbor Insurance</h1></header><main><h2 id="heading">Step 1 of 4: Driver</h2><p id="error" class="error" role="alert"></p><section id="step1"><label>Full name<input id="full_name" autocomplete="name"></label><label>Date of birth<input id="date_of_birth" type="date"></label></section><section id="step2" hidden><label>Any prior claims?<select id="prior_claims"><option value="no">No</option><option value="yes">Yes</option></select></label><label id="claims-label" hidden>How many claims?<input id="claim_count" type="number" min="1"></label><label>Annual kilometres<input id="annual_km" type="number"></label></section><section id="step3" hidden><label>Coverage plan<select id="plan"><option value="third-party">Third party</option><option value="comprehensive">Comprehensive</option></select></label><fieldset><legend>Excess</legend><label><input type="radio" name="excess" value="250">$250</label><label><input type="radio" name="excess" value="500">$500</label></fieldset><label><input id="roadside" type="checkbox">Include roadside assistance</label></section><section id="step4" hidden><h3>Review your quote</h3><div id="review" class="review"></div><p>Submitting creates this test quote.</p></section><nav><button id="back" type="button" hidden>Back</button><button id="next" type="button">Continue</button><button id="submit" type="button" hidden>Submit quote</button></nav><section id="done" hidden><h2 class="success">Quote created</h2><p>Quote reference: <strong id="reference"></strong></p></section></main></body></html>
