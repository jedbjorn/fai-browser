<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Bluebird Shop</title><link rel="stylesheet" href="../style.css"><script src="app.js" defer></script></head><body><header><h1>Bluebird Shop</h1></header><main><section id="product"><h2>Everyday Jacket</h2><p>$120.00 each</p><label>Size<select id="size"><option value="S">S</option><option value="M">M</option><option value="L">L</option></select></label><fieldset><legend>Colour</legend><label><input type="radio" name="colour" value="black" checked>Black</label><label><input type="radio" name="colour" value="blue">Blue</label></fieldset><label>Quantity<input id="quantity" type="number" min="1" value="1"></label><label>Coupon code<input id="coupon" placeholder="Coupon code"></label><button id="apply" type="button">Apply coupon</button><p id="coupon-status" aria-live="polite"></p><p>Total: <strong id="total">$120.00</strong></p><button id="checkout" type="button">Go to checkout</button></section><section id="checkout-page" hidden><h2>Checkout</h2><div id="review" class="review"></div><p id="error" class="error"></p><button id="pay" type="button">Pay $216.00</button></section><section id="done" hidden><h2 class="success">Order confirmed</h2><p>Order id: <strong id="order"></strong></p></section></main></body></html>
