<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FAI Browser social card</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0a100e;color:#e8f0ed;font:400 28px/1.4 ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(700px 420px at 78% 40%,rgba(63,216,191,.22),transparent 70%)}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.01em}
.brand svg{width:40px;height:40px;color:#3fd8bf}
h1{position:absolute;left:72px;top:170px;width:560px;font-size:68px;line-height:1.04;letter-spacing:-.035em;font-weight:800}
h1 span{color:#3fd8bf}
p{position:absolute;left:72px;bottom:64px;color:#9fb2ab;font-size:26px}
.win{position:absolute;left:660px;top:120px;width:470px;height:330px;border-radius:18px;background:#111a18;border:1px solid #2a3a35;box-shadow:0 40px 80px -30px #000}
.bar{height:44px;background:#1b2724;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:8px;padding:0 18px}
.bar i{width:12px;height:12px;border-radius:50%;background:#ff6b5f}.bar i:nth-child(2){background:#f3bf4c}.bar i:nth-child(3){background:#4fd16b}
.bar b{margin-left:14px;font:500 15px ui-monospace,monospace;color:#9db1aa;font-weight:500}
.tok{margin:40px 28px 0;height:54px;border:1px solid #3fd8bf;border-radius:11px;background:rgba(63,216,191,.12);color:#3fd8bf;font:600 17px/54px ui-monospace,monospace;padding:0 16px;white-space:nowrap}
.gate{position:absolute;left:150px;top:196px;width:290px;padding:18px;border-radius:16px;background:rgba(24,35,31,.95);border:1px solid #8a6a2e;box-shadow:0 30px 50px -20px #000;font-size:19px;font-weight:700}
.gate small{display:block;font-weight:400;color:#9db1aa;font-size:16px;margin:6px 0 14px}
.gate div{display:flex;gap:10px}.gate span{flex:1;text-align:center;padding:9px 0;border-radius:9px;border:1px solid #2a3a35;font-size:16px}
.gate span+span{background:#3fd8bf;color:#04201b;border-color:#3fd8bf}
.gate em{display:inline-block;width:24px;height:24px;border-radius:50%;background:#d1332a;color:#fff;font-style:normal;text-align:center;line-height:24px;margin-right:10px;font-size:15px}
.l{margin:18px 28px 0;height:10px;border-radius:5px;background:#22322d}
</style></head><body>
<div class="glow"></div>
<div class="brand"><svg viewBox="0 0 32 32"><rect x="2" y="5" width="28" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M2 12h28" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="19.5" r="3.2" fill="currentColor"/></svg>FAI Browser</div>
<h1>One approved tab. <span>Your say-so.</span></h1>
<p>Open-source browser layer for coding agents · MIT · illustrative, made-up site</p>
<div class="win"><div class="bar"><i></i><i></i><i></i><b>lumen.example/settings/tokens</b></div>
<div class="tok">[secret:1 demo …MPLE len 28]</div><div class="l" style="width:70%"></div><div class="l" style="width:50%"></div>
<div class="gate"><em>!</em>Approve this action?<small>Purchase · “Place order”</small><div><span>Deny</span><span>Approve once</span></div></div></div>
</body></html>
