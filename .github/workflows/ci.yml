name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The extension and guardrail tests drive headless Chromium through playwright-core.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Export CHROMIUM_PATH
        run: echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      # One browser-backed file at a time: parallel browsers distort the observe-speed regression checks.
      - run: npm test

  # Windows and macOS: the browserless suite (no Chromium on these runners). Real evidence for the platform branches in
  # src/ (paths, the daemon, the lock, native messaging registration, agent registration, the updater).
  platforms:
    name: Browserless tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A per-test timeout: a test that hangs on one platform fails by name instead of running into the job timeout. It
      # also bounds each file, and typing-rhythm.test.js needs over two minutes on the Windows runner.
      - run: npm run test:browserless -- --test-timeout=300000

  # The bootstrap installers on a throwaway runner, for real: check-only, a fresh clone of the latest release, a rerun
  # that reuses it, and (macOS, under a pseudo-terminal, since setup refuses to run without one) the full setup of this
  # checkout against a private FAI_HOME and port. No npm ci: the installers need none. No browser.
  installer-macos:
    name: Installer (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Private FAI_HOME and port
        run: |
          echo "FAI_HOME=$RUNNER_TEMP/fai home" >> "$GITHUB_ENV"
          echo "FAI_DAEMON_PORT=47318" >> "$GITHUB_ENV"
      - name: Check only
        run: sh scripts/install.sh --check
      # The .pkg path's checks against the real package, without installing it: the SHA-256 from SHASUMS256.txt and
      # Apple's signature check with the expected signer (pkgutil prints the chain).
      - name: Node.js .pkg checksum and signature (no install)
        run: |
          set -eu
          dist=https://nodejs.org/dist/latest-v24.x
          work="$RUNNER_TEMP/node-pkg"
          mkdir -p "$work"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/SHASUMS256.txt" "$dist/SHASUMS256.txt"
          line="$(grep -E '^[0-9a-f]{64}  node-v24\.[0-9]+\.[0-9]+\.pkg$' "$work/SHASUMS256.txt" | head -n 1)"
          name="${line##* }"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$work/$name" "$dist/$name"
          test "$(shasum -a 256 "$work/$name" | cut -d ' ' -f 1)" = "${line%% *}"
          sh scripts/install.sh --verify-node-pkg "$work/$name"
          # An unsigned package is refused.
          pkgbuild --nopayload --identifier org.example.unsigned --version 1 "$work/unsigned.pkg"
          if sh scripts/install.sh --verify-node-pkg "$work/unsigned.pkg"; then echo 'an unsigned package passed'; exit 1; fi
      - name: Fresh clone of the latest release (setup waits for a terminal)
        run: |
          set -eu
          dir="$RUNNER_TEMP/fai browser"
          sh scripts/install.sh --yes --dir "$dir" | tee "$RUNNER_TEMP/first.txt"
          grep -q 'Setup must run in a terminal' "$RUNNER_TEMP/first.txt"
          tag="$(git -C "$dir" describe --tags --exact-match)"
          echo "checked out $tag"
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test -z "$(git -C "$dir" status --porcelain)"
          node "$dir/src/cli.js" update --check | tee "$RUNNER_TEMP/update.json"
          grep -q '"installable":true' "$RUNNER_TEMP/update.json"
          sh scripts/install.sh --yes --dir "$dir" | tee "$RUNNER_TEMP/second.txt"
          grep -q 'Using the existing checkout' "$RUNNER_TEMP/second.txt"
      - name: Setup of this checkout through the installer, twice (pseudo-terminal)
        run: |
          set -eu
          for round in 1 2; do
            script -q "$RUNNER_TEMP/setup-$round.txt" sh scripts/install.sh --yes --dir "$GITHUB_WORKSPACE" -- --no-firefox < /dev/null
            grep -q 'FAI Browser is installed in' "$RUNNER_TEMP/setup-$round.txt"
          done
          grep -q 'FAI service running (reloaded the settings)' "$RUNNER_TEMP/setup-2.txt"
          test "$(stat -f %Lp "$FAI_HOME/.env.local")" = 600
          node src/cli.js daemon status > "$RUNNER_TEMP/status.json"
          grep -q '"running":true' "$RUNNER_TEMP/status.json"
          node src/cli.js install-native --dry-run
      - name: Clean up
        if: always()
        run: |
          node src/cli.js daemon stop || true
          node src/cli.js uninstall-native || true

  installer-windows:
    name: Installer (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      FAI_INSTALL_ROOT: ${{ runner.temp }}\fai install
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Private FAI_HOME and port; this checkout as the source zip
        run: |
          "FAI_HOME=$env:RUNNER_TEMP\fai home" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "FAI_DAEMON_PORT=47318" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          git archive --format=zip -o "$env:RUNNER_TEMP\source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          "FAI_INSTALL_ZIP=$env:RUNNER_TEMP\source.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # Windows PowerShell 5.1 (powershell.exe), as on a stock Windows 10 or 11. The runner is an administrator.
      - name: An elevated window is refused before anything changes
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'runs as administrator') { throw 'expected the administrator refusal' }
          if (Test-Path $env:FAI_INSTALL_ROOT) { throw 'the refused run created the install folder' }
      # Setup itself (Firefox download, launch and pairing) needs a desktop session: it runs on a real Windows machine,
      # not here. Its service start goes through WMI, which the next step exercises.
      - name: Install from this checkout (files only), the private Node.js from nodejs.org
        env:
          FAI_INSTALL_ALLOW_ADMIN: '1'
          FAI_INSTALL_NO_SETUP: '1'
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'Checksum matches SHASUMS256.txt' -or $out -notmatch 'Done \(files only') { throw 'install failed' }
          $app = Get-ChildItem "$env:FAI_INSTALL_ROOT\app" -Directory
          if (@($app).Count -ne 1 -or -not (Test-Path "$($app.FullName)\.fai-install")) { throw 'no app folder with the installer marker' }
          if (-not (Test-Path "$env:FAI_INSTALL_ROOT\bin\fai-browser.cmd")) { throw 'no fai-browser command' }
          if (-not (Test-Path "$env:FAI_INSTALL_ROOT\uninstall.ps1")) { throw 'no uninstall.ps1' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'FAI Browser.lnk'
          if (-not (Test-Path $lnk)) { throw 'no Start menu entry' }
          $bin = "$env:FAI_INSTALL_ROOT\bin"
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $bin) { throw 'bin is not on the user PATH' }
      - name: The installed command; the service starts through WMI and the command returns
        run: |
          $fai = "$env:FAI_INSTALL_ROOT\bin\fai-browser.cmd"
          & $fai install-native --browser firefox
          if ($LASTEXITCODE -ne 0) { throw 'install-native failed' }
          reg query 'HKCU\Software\Mozilla\NativeMessagingHosts\fai_browser' /ve
          if ($LASTEXITCODE -ne 0) { throw 'no Firefox registry value' }
          # The command's output is piped: before the WMI start the service inherited the pipe and this never returned.
          $start = & $fai daemon start | Out-String
          Write-Output $start
          if ($LASTEXITCODE -ne 0 -or $start -notmatch '"state":"running"') { throw 'daemon start failed' }
          $status = & $fai daemon status | Out-String
          if ($status -notmatch '"running":true') { throw 'the daemon is not running' }
          $update = & $fai update --check | Out-String
          Write-Output $update
          if ($update -notmatch '"installer":true') { throw 'the copy does not know it came from the installer' }
          $logs = Join-Path $env:FAI_HOME 'logs\daemon-start.log'
          if (-not (Test-Path $logs)) { Get-ChildItem -Recurse $env:FAI_HOME | Select-Object FullName; throw 'no daemon-start.log (not started through WMI?)' }
      - name: Run again (an update while the service runs)
        env:
          FAI_INSTALL_ALLOW_ADMIN: '1'
          FAI_INSTALL_NO_SETUP: '1'
        run: |
          Start-Sleep -Seconds 1
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'is already in' -or $out -notmatch 'Done \(files only') { throw 'the rerun failed' }
          $newest = Get-ChildItem "$env:FAI_INSTALL_ROOT\app" -Directory | Sort-Object Name | Select-Object -Last 1
          if ((Get-Content "$env:FAI_INSTALL_ROOT\bin\fai-browser.cmd" -Raw) -notmatch [regex]::Escape($newest.FullName)) { throw 'the command does not run the new copy' }
      - name: Uninstall removes everything
        env:
          FAI_UNINSTALL_YES: '1'
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:FAI_INSTALL_ROOT\uninstall.ps1" 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'FAI Browser is removed') { throw 'uninstall did not finish' }
          if (Test-Path $env:FAI_INSTALL_ROOT) { throw 'the install folder is still there' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'FAI Browser.lnk')) { throw 'the Start menu entry is still there' }
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains "$env:FAI_INSTALL_ROOT\bin") { throw 'bin is still on PATH' }
          reg query 'HKCU\Software\Mozilla\NativeMessagingHosts\fai_browser' /ve 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'the Firefox registry value is still there' }
          exit 0
