name: Site (build check and Pages deploy)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site-benchmark-data.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/site-benchmark-data.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required files and local references
        run: |
          set -eu
          for f in index.html 404.html styles.css hero.css app.js favicon.svg media/social-preview.png media/demo.mp4 media/approval-card.png media/approve-once.png media/secret-placeholders.png media/evidence/public-pilots-2026-11-07.json media/evidence/gmail-case-2026-11-07.json; do
            test -s "site/$f" || { echo "missing site/$f"; exit 1; }
          done
          for ref in styles.css hero.css app.js favicon.svg; do
            grep -q "$ref" site/index.html || { echo "index.html does not reference $ref"; exit 1; }
          done
          if grep -nE '(src|href)="https?://(cdn|unpkg|fonts)' site/index.html; then
            echo "runtime CDN reference found"; exit 1
          fi
          du -sk site
      - name: Check generated public trial charts are current
        run: node --check site/app.js && npm run site:benchmark-data && git diff --exit-code
      - name: Validate local assets and exploratory public trial evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, statSync } from 'node:fs';
          import { resolve, sep } from 'node:path';
          const root = resolve('site');
          const html = readFileSync(resolve(root, 'index.html'), 'utf8');
          for (const [, ref] of html.matchAll(/(?:src|href)=["']([^"']+)["']/g)) {
            if (/^(?:[a-z]+:|\/\/|#)/i.test(ref)) continue;
            const local = decodeURIComponent(ref.split(/[?#]/)[0]).replace(/^\/fai-browser\//, '');
            let file = resolve(root, local || 'index.html');
            if (!file.startsWith(root + sep) || !existsSync(file)) throw new Error(`Missing local asset: ${ref}`);
            if (statSync(file).isDirectory()) file = resolve(file, 'index.html');
            if (!existsSync(file)) throw new Error(`Missing local page: ${ref}`);
          }
          const fail = message => { throw new Error(message); };
          const dataText = readFileSync(resolve(root, 'media/evidence/public-pilots-2026-11-07.json'), 'utf8');
          const data = JSON.parse(dataText);
          const tasks = ['flights', 'amazon', 'airbnb'];
          const drivers = ['fai', 'playwright'];
          if (data.schemaVersion !== 1 || data.measuredAt !== '2026-11-07' ||
              !Array.isArray(data.pairs) || data.pairs.length !== tasks.length ||
              data.pairs.map(pair => pair.task).join() !== tasks.join()) fail('Invalid public trial schema/task coverage');
          if (!data.classification.includes('not a controlled A/B test') ||
              data.provenance.modelRequested !== 'gpt-6-astra' || data.provenance.modelReported !== null ||
              data.provenance.costUsd !== null || data.provenance.fullTaskMachineVerified !== null ||
              data.provenance.faiBrowser !== 'Firefox' || data.provenance.playwrightBrowser !== 'Chromium' ||
              !Array.isArray(data.confounds) || data.confounds.length < 6) fail('Missing exploratory provenance/limitations');
          for (const pair of data.pairs) {
            if (!pair.outcome || !pair.verification.includes('full-task success unestablished')) fail('Missing bounded outcome');
            for (const driver of drivers) {
              const run = pair[driver];
              for (const field of ['wallMs', 'toolCalls', 'inputTokens', 'cachedInputTokens', 'uncachedInputTokens', 'outputTokens']) {
                if (!Number.isFinite(run?.[field]) || run[field] < 0 ||
                    (field !== 'wallMs' && !Number.isSafeInteger(run[field]))) fail(`Invalid ${pair.task}/${driver}/${field}`);
              }
              if (run.wallMs === 0 || run.toolCalls === 0 ||
                  run.inputTokens - run.cachedInputTokens !== run.uncachedInputTokens) fail('Invalid timing or fresh input accounting');
            }
            for (const field of ['faiStale', 'faiNoControl', 'playwrightRecoveredInteractionErrors', 'playwrightReportedAccessRefusals']) {
              if (!Number.isSafeInteger(pair.recovery?.[field]) || pair.recovery[field] < 0) fail('Invalid recovery accounting');
            }
            if (pair.playwright.wallMs >= pair.fai.wallMs ||
                pair.playwright.uncachedInputTokens >= pair.fai.uncachedInputTokens) fail('Published comparison claim no longer matches evidence');
          }
          const attemptIds = ['flight-startup', 'flight-handoff', 'amazon-interrupted', 'playwright-airbnb-tab-selection'];
          if (!Array.isArray(data.additionalAttempts) || data.additionalAttempts.length !== attemptIds.length ||
              new Set(data.additionalAttempts.map(attempt => attempt.id)).size !== attemptIds.length ||
              attemptIds.some(id => !data.additionalAttempts.some(attempt => attempt.id === id && attempt.outcome))) fail('Incomplete additional-attempt ledger');
          if (!Array.isArray(data.sourceAudits) || data.sourceAudits.length !== 6 ||
              tasks.some(task => drivers.some(driver => data.sourceAudits.filter(audit => audit.task === task && audit.driver === driver && /^[a-f0-9]{64}$/.test(audit.sha256)).length !== 1))) fail('Missing source audit fingerprints');
          if (/\/tmp\/|\/home\/|Bearer\s|client-token|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(dataText)) fail('Private/local evidence leaked into public data');
          const caseText = readFileSync(resolve(root, 'media/evidence/gmail-case-2026-11-07.json'), 'utf8');
          const gmail = JSON.parse(caseText);
          if (gmail.schemaVersion !== 1 || gmail.outcome !== 'incomplete' || gmail.reportedAccessRefusals !== 0 ||
              gmail.checks.searchSubmitCount !== 1 || gmail.checks.queryMatched !== true ||
              gmail.checks.resultsVisible !== true || gmail.checks.datesVisible !== true ||
              gmail.checks.menuOpened !== false || gmail.checks.menuClosedUnchanged !== false ||
              gmail.checks.coverageIncomplete !== true || gmail.provenance.modelReported !== null ||
              gmail.provenance.costUsd !== null || !gmail.classification.includes('not a paired benchmark') ||
              !html.includes('Task not completed') || !html.includes('gmail-case-2026-11-07.json')) fail('Invalid separate Gmail case');
          for (const field of ['wallMs', 'toolCalls', 'inputTokens', 'cachedInputTokens', 'uncachedInputTokens', 'outputTokens']) {
            if (!Number.isFinite(gmail.metrics[field]) || gmail.metrics[field] < 0 ||
                (field !== 'wallMs' && !Number.isSafeInteger(gmail.metrics[field]))) fail('Invalid Gmail usage');
          }
          if (gmail.metrics.inputTokens - gmail.metrics.cachedInputTokens !== gmail.metrics.uncachedInputTokens) fail('Gmail fresh input mismatch');
          if (/\/tmp\/|\/home\/|Bearer\s|client-token|Profile\s*\d|[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(caseText)) fail('Private metadata leaked into Gmail case');
          for (const metric of ['wall', 'fresh']) {
            if ((html.match(new RegExp(`data-chart-metric="${metric}"`, 'g')) || []).length !== 1 ||
                !html.includes(`data-metric="${metric}"`)) fail(`Missing ${metric} chart/control`);
          }
          if ((html.match(/class="pilot-card"/g) || []).length !== 6 ||
              (html.match(/class="pilot-series fai"/g) || []).length !== 6 ||
              (html.match(/class="pilot-series playwright"/g) || []).length !== 6 ||
              !html.includes('Exact values as a table') || !html.includes('All six runs returned partial results.') ||
              !html.includes('common zero baseline') || !html.includes('public-pilots-2026-11-07.json')) fail('Incomplete static charts, labels, table or caveats');
          if (/id="benchmark-(text|visual)-chart"|Host-only cost per task|90.3% fewer/.test(html)) fail('Retired claims reintroduced');
          console.log('Public trial evidence: six runs, four additional attempts, six audit fingerprints; static chart and asset checks passed.');
          NODE
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
