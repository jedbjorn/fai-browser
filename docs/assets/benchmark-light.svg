<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="602" viewBox="0 0 1200 602" role="img" aria-labelledby="t-light d-light">
<title id="t-light">FAI Browser vs Playwright MCP: per-task wall time, cost and tool calls for six host models</title>
<desc id="d-light">GPT-6.1 Sol: wall 26.2 s to 18.8 s (1.40× faster), cost $0.0346 to $0.0292 (1.19× cheaper), tool calls 5.9 to 1.0; GPT-6 Astra: wall 23.9 s to 17.6 s (1.35× faster), cost $0.189 to $0.151 (1.25× cheaper), tool calls 5.8 to 1.0; Claude Opus 5.5: wall 13.1 s to 8.6 s (1.53× faster), cost $0.0432 to $0.0343 (1.26× cheaper), tool calls 4.9 to 1.1; Claude Sonnet 5.5: wall 8.8 s to 7.1 s (1.24× faster), cost $0.0213 to $0.00936 (2.28× cheaper), tool calls 5.1 to 1.0; GPT-6 Luna: wall 19.2 s to 13.5 s (1.42× faster), cost $0.00195 to $0.00140 (1.40× cheaper), tool calls 5.9 to 1.3; GPT-5.6 Terra: wall 22.1 s to 12.8 s (1.73× faster), cost $0.0447 to $0.0201 (2.23× cheaper), tool calls 6.0 to 1.0.</desc>
